name: Build and Push WeatherWeb Docker Image to ACR

on:
  push:
    paths:
      - 'MCPServers/WeatherWeb/**'
      - '.github/workflows/docker-publish-weatherweb.yml'
      - 'Infrastructure/containerApp-WeatherWeb.bicepparam'
    branches:
      - main
  workflow_dispatch:

jobs:
  call-docker-publish:
    uses: ./.github/workflows/docker-publish-template.yml
    with:
      mcp_server: 'WeatherWeb'
      image_name: 'weatherweb'
      docker_context: 'MCPServers'
    secrets: inherit

  deploy-container-app:
    needs: call-docker-publish
    uses: ./.github/workflows/docker-deploy-containerapp-template.yml
    with:
      parameter_file_name: containerApp-WeatherWeb.bicepparam
    secrets: inherit

  set-secrets:
    needs: deploy-container-app
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Anthropic API key on Container App
        run: |
          az containerapp secret set \
            --name weatherweb \
            --resource-group rg-mymcpenv \
            --secrets anthropic-api-key="${{ secrets.ANTHROPIC_API_KEY }}"

          az containerapp update \
            --name weatherweb \
            --resource-group rg-mymcpenv \
            --set-env-vars "Anthropic__ApiKey=secretref:anthropic-api-key"
